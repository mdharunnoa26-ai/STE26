<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style id="pg"></style><title>STE Digital Hub – Smart Shop Management System</title>
<style>
:root{--bg:#eef2f9;--cd:#fff;--tx:#10203a;--mu:#5b6b85;--pr:#1558d6;--dk:#0b2a6b;--bd:#d5deee;--ok:#15803d;--er:#dc2626;--hd:#0b2a6b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1322;--cd:#152038;--tx:#e8eefc;--mu:#9bb0d3;--pr:#4b8bff;--dk:#a8c4ff;--bd:#28365a;--ok:#4ade80;--er:#f87171;--hd:#0a1a40}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Hind Siliguri","Noto Sans Bengali","Segoe UI",system-ui,sans-serif}
header{background:var(--hd);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px}header img{height:52px;width:52px;border-radius:50%;background:#fff}
header h1{margin:0;font-size:19px}header p{margin:0;font-size:12px;opacity:.8}
#nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--cd);border-bottom:1px solid var(--bd)}
#nav button{white-space:nowrap;border:1px solid var(--bd);background:none;color:var(--tx);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer}
#nav button.on{background:var(--pr);border-color:var(--pr);color:#fff;font-weight:600}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}.card h3{margin:0 0 10px;font-size:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select{padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit;width:100%}
.b{background:var(--pr);color:#fff;border:0;padding:9px 16px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;margin:2px 4px 2px 0}.b.s{background:var(--ok)}.b.o{background:none;color:var(--pr);border:1px solid var(--pr)}
.x{background:none;border:0;color:var(--er);cursor:pointer;font-size:15px}
.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}.k div{background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--pr);border-radius:8px;padding:10px}
.k small{color:var(--mu);display:block}.k b{font-size:19px}.er{color:var(--er)}.ok{color:var(--ok)}.mu{color:var(--mu)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px}
.ch{display:flex;gap:8px;height:150px}.cc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center}.bw{flex:1;display:flex;align-items:flex-end;gap:2px}.bw i{flex:1;border-radius:3px 3px 0 0}.cc small{font-size:11px;color:var(--mu)}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:6px}.lg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
#pr{display:none}#pr,#pr *{color:#000!important;background:#fff!important;border-color:#bbb!important}#pr th{background:#e8eefc!important}
.ih{display:flex;gap:14px;align-items:center}.ih img{height:80px}.ih h2{margin:0}.ih p{margin:2px 0;font-size:13px}
@media print{body>*:not(#pr){display:none!important}#pr{display:block;padding:10px}}
.th{width:72mm;font-size:12px}.th .ih{flex-direction:column;text-align:center}.th .ih img{height:56px}.th table{font-size:11px}.th th,.th td{padding:2px;white-space:normal}
</style></head><body>

<div class="card">${tbl(['পণ্য','পরিমাণ','দর','মোট',''],P.cart.map((i,k)=>[esc(i.name),i.qty,f(i.price),f(i.qty*i.price),`<button class="x" onclick="P.cart.splice(${k},1);render()">✕</button>`]))}<br><div class="g">${inp('qd','ছাড় (৳)','number',P.disc||'','oninput="P.disc=+this.value||0;upd()"')}${inp('qa','পরিশোধ (৳) — ফাঁকা = পুরো টাকা','number',P.paid,'oninput="P.paid=this.value;upd()"')}</div><p id="tt">${ptx()}</p><button class="b s" onclick="sell()">বিক্রয় সম্পন্ন করুন ও মেমো প্রিন্ট</button></div>
<div class="card"><h3>আজকের বিক্রয়</h3>${tbl(['মেমো','গ্রাহক','মোট','পরিশোধ','বাকি','',''],db.s.filter(s=>s.date==td()).map(s=>[s.no,esc(s.cname),f(s.total),f(s.paid),f(s.due),`<button class="b o" onclick="inv('${s.id}')">প্রিন্ট</button>`,del('s',s.id)]))}</div>`;
function addCart(){const p=db.p.find(x=>x.id==g('qp'));if(!p)return alert('পণ্য নির্বাচন করুন');P.cart.push({pid:p.id,name:p.name,qty:n('qq')||1,price:n('qr')||p.sell,buy:p.buy});render()}
function sell(){const t=ptot();if(!P.cart.length)return alert('কোনো পণ্য যোগ করা হয়নি');if(t.due>0&&!P.cid)return alert('বাকি রাখতে হলে গ্রাহক নির্বাচন করুন');
const c=db.c.find(x=>x.id==P.cid),s={id:uid(),no:'INV-'+String(++db.n).padStart(4,'0'),date:td(),cid:P.cid,cname:c?c.name:'ওয়াক-ইন গ্রাহক',items:P.cart,disc:P.disc,sub:t.sub,total:t.total,paid:t.paid,due:t.due};
P.cart.forEach(i=>stk(i.pid,-i.qty));db.s.push(s);save();P={cart:[],cid:'',disc:0,paid:''};render();inv(s.id)}
const hdr=()=>`<div class="ih"><img src="${LOGO}"><div><h2>STE Digital Hub</h2><p>IT Repair &amp; Support Center</p><p>ঠিকানা: চতর বাজার, ২৪ নং ওয়ার্ড, গাজীপুর সিটি করপোরেশন</p><p>মোবাইল / WhatsApp: +8801733242800</p></div></div><hr>`;
function pr(h,t){const w=t&&LS('ste_paper')=='80';$('#pr').className=w?'th':'';$('#pg').textContent=w?'@page{size:80mm auto;margin:3mm}':'';$('#pr').innerHTML=hdr()+h;setTimeout(()=>window.print(),150)}
function inv(id){const s=db.s.find(x=>x.id==id),c=db.c.find(x=>x.id==s.cid);pr(`<p><b>মেমো নং:</b> ${s.no} &nbsp; <b>তারিখ:</b> ${s.date}<br><b>গ্রাহক:</b> ${esc(s.cname)} ${c?esc(c.phone):''}</p>${tbl(['#','পণ্য','পরিমাণ','দর','মোট'],s.items.map((i,k)=>[k+1,esc(i.name),i.qty,f(i.price),f(i.qty*i.price)]))}<p style="text-align:right">সাব-টোটাল: ${f(s.sub)}<br>ছাড়: ${f(s.disc)}<br><b>সর্বমোট: ${f(s.total)}</b><br>পরিশোধ: ${f(s.paid)}<br><b>বাকি: ${f(s.due)}</b></p><p style="text-align:center">ধন্যবাদ, আবার আসবেন!</p>`,1)}
V.prod=()=>`<div class="card"><h3>নতুন পণ্য</h3><div class="g">${inp('pc','পণ্যের কোড')}${inp('pn','পণ্যের নাম')}${inp('pb','ক্রয়মূল্য','number')}${inp('ps','বিক্রয়মূল্য','number')}${inp('pk','শুরুর স্টক','number')}</div><button class="b" onclick="addP()">সংরক্ষণ করুন</button></div><div class="card"><h3>স্টক তালিকা</h3>${tbl(['কোড','নাম','ক্রয়','বিক্রয়','স্টক','স্টকের মূল্য',''],db.p.map(p=>[esc(p.code),esc(p.name),f(p.buy),f(p.sell),`<b class="${p.stock<=3?'er':''}">${p.stock}</b>`,f(p.stock*p.buy),del('p',p.id)]))}</div>`;
function addP(){if(!g('pn'))return alert('পণ্যের নাম দিন');db.p.push({id:uid(),code:g('pc'),name:g('pn'),buy:n('pb'),sell:n('ps'),stock:n('pk')});save();render()}
V.cust=()=>`<div class="card"><h3>নতুন গ্রাহক</h3><div class="g">${inp('cn','নাম')}${inp('cp','ফোন','tel')}${inp('ca','ঠিকানা')}</div><button class="b" onclick="addC()">সংরক্ষণ করুন</button></div><div class="card"><h3>গ্রাহক ও বাকির হিসাব</h3>${tbl(['নাম','ফোন','ঠিকানা','ইনভয়েস','মোট ক্রয়','বাকি','',''],db.c.map(c=>{const d=custDue(c);return[esc(c.name),esc(c.phone),esc(c.addr),d.n,f(d.tot),`<b class="${d.due>0?'er':''}">${f(d.due)}</b>`,`<button class="b o" onclick="recv('${c.id}')">টাকা জমা</button>`,del('c',c.id)]}))}</div><div class="card"><h3>বাকি আদায়ের তালিকা</h3>${tbl(['তারিখ','গ্রাহক','পরিমাণ',''],db.r.map(r=>[r.date,esc((db.c.find(c=>c.id==r.cid)||{}).name),f(r.amt),del('r',r.id)]))}</div>`;
function addC(){if(!g('cn'))return alert('নাম দিন');db.c.push({id:uid(),name:g('cn'),phone:g('cp'),addr:g('ca')});save();render()}
function recv(id){const a=+prompt('কত টাকা জমা নিলেন?');if(a>0){db.r.push({id:uid(),date:td(),cid:id,amt:a});save();render()}}
V.ord=()=>`<div class="card"><h3>নতুন অনলাইন অর্ডার</h3><div class="g">${inp('od','তারিখ','date',td())}${inp('on','কাস্টমারের নাম')}${inp('oh','ফোন','tel')}${inp('oa','ঠিকানা')}${sel('op','পণ্য',pOpt(),'','onchange="pk(\'op\',\'or\',\'sell\')"')}${inp('oq','পরিমাণ','number',1)}${inp('or','দর (৳)','number')}${inp('ol','ডেলিভারি চার্জ','number',0)}${inp('oy','অগ্রিম পেমেন্ট','number',0)}${sel('oc','কুরিয়ার',['Pathao','Steadfast','RedX','Paperfly','Sundarban','নিজস্ব'])}${sel('os','স্ট্যাটাস',ST)}</div><button class="b" onclick="addO()">অর্ডার সংরক্ষণ</button></div><div class="card"><h3>অর্ডার তালিকা (COD বাকি: ${f(sum(db.o,cod))})</h3>${tbl(['তারিখ','কাস্টমার','পণ্য','মোট','ডেলিভারি','অগ্রিম','COD','কুরিয়ার','স্ট্যাটাস',''],db.o.map(o=>[o.date,`${esc(o.name)} ${esc(o.phone)}<br><small class="mu">${esc(o.addr)}</small>`,`${esc(o.pname)} ×${o.qty}`,f(o.qty*o.price),f(o.del),f(o.paid),f(cod(o)),esc(o.courier),`<select onchange="setSt('${o.id}',this.value)">${ST.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select>`,del('o',o.id)]).reverse())}</div>`;
function addO(){const p=db.p.find(x=>x.id==g('op'));if(!g('on')||!p)return alert('কাস্টমারের নাম ও পণ্য দিন');const q=n('oq')||1;db.o.push({id:uid(),date:g('od'),name:g('on'),phone:g('oh'),addr:g('oa'),pid:p.id,pname:p.name,qty:q,price:n('or')||p.sell,buy:p.buy,del:n('ol'),paid:n('oy'),courier:g('oc'),status:g('os')});p.stock-=q;save();render()}
function setSt(id,v){db.o.find(o=>o.id==id).status=v;save();render()}
V.pur=()=>`<div class="card"><h3>নতুন ক্রয়</h3><div class="g">${inp('ud','তারিখ','date',td())}${inp('us','সরবরাহকারী')}${sel('up','পণ্য',pOpt(),'','onchange="pk(\'up\',\'uc\',\'buy\')"')}${inp('uq','পরিমাণ','number',1)}${inp('uc','একক ক্রয়মূল্য','number')}${inp('ua','পরিশোধ (ফাঁকা = পুরো)','number')}</div><button class="b" onclick="addU()">ক্রয় সংরক্ষণ (স্টক বাড়বে)</button></div><div class="card"><h3>ক্রয়ের তালিকা</h3>${tbl(['তারিখ','সরবরাহকারী','পণ্য','পরিমাণ','মোট','পরিশোধ','সরবরাহকারীর পাওনা',''],db.u.map(u=>[u.date,esc(u.sup),esc(u.pname),u.qty,f(u.qty*u.cost),f(u.paid),f(u.qty*u.cost-u.paid),del('u',u.id)]).reverse())}</div>`;
function addU(){const p=db.p.find(x=>x.id==g('up')),q=n('uq');if(!p||!q)return alert('পণ্য ও পরিমাণ দিন');const c=n('uc')||p.buy;db.u.push({id:uid(),date:g('ud'),sup:g('us'),pid:p.id,pname:p.name,qty:q,cost:c,paid:g('ua')===''?q*c:n('ua')});p.stock+=q;p.buy=c;save();render()}
V.exp=()=>`<div class="card"><h3>নতুন খরচ</h3><div class="g">${inp('xd','তারিখ','date',td())}${sel('xc','খাত',['ভাড়া','বেতন','বিদ্যুৎ','ইন্টারনেট','পরিবহন','মেরামত','অন্যান্য'])}${inp('xa','পরিমাণ (৳)','number')}${inp('xn','নোট')}</div><button class="b" onclick="addX()">সংরক্ষণ করুন</button></div><div class="card"><h3>খরচের তালিকা (মোট ${f(sum(db.x,x=>x.amt))})</h3>${tbl(['তারিখ','খাত','পরিমাণ','নোট',''],db.x.map(x=>[x.date,x.cat,f(x.amt),esc(x.note),del('x',x.id)]).reverse())}</div>`;
function addX(){if(!n('xa'))return alert('পরিমাণ দিন');db.x.push({id:uid(),date:g('xd'),cat:g('xc'),amt:n('xa'),note:g('xn')});save();render()}
V.cash=()=>{const ds=[...new Set([...db.s,...db.o,...db.u,...db.x,...db.r].map(x=>x.date))].sort();let b=0;const rows=ds.map(d=>{const t=stat(d,d);b+=t.cashIn-t.cashOut;return[d,f(t.cashIn),f(t.cashOut),f(t.cashIn-t.cashOut),`<b>${f(b)}</b>`]}).reverse(),a=stat();return `<div class="k">${kp('মোট নগদ আয়',f(a.cashIn),'ok')}${kp('মোট নগদ ব্যয়',f(a.cashOut),'er')}${kp('ক্যাশ ব্যালেন্স',f(a.cashIn-a.cashOut))}</div><div class="card"><h3>দৈনিক ক্যাশ রেজিস্টার</h3>${tbl(['তারিখ','আয়','ব্যয়','নিট','ব্যালেন্স'],rows)}</div>`};
V.pl=()=>{const ms=[...new Set([...db.s,...db.o,...db.u,...db.x].map(x=>x.date.slice(0,7)))].sort().reverse(),row=(l,s)=>[l,f(s.sales),f(s.cogs),f(s.gp),f(s.exp),`<b class="${s.profit<0?'er':'ok'}">${f(s.profit)}</b>`],a=stat();return `<div class="k">${kp('মোট বিক্রয়',f(a.sales))}${kp('মোট লাভ (খরচ বাদে)',f(a.gp))}${kp('মোট খরচ',f(a.exp))}${kp(a.profit<0?'নিট ক্ষতি':'নিট লাভ',f(a.profit),a.profit<0?'er':'ok')}</div><div class="card"><h3>মাসভিত্তিক লাভ-ক্ষতি</h3>${tbl(['মাস','বিক্রয়','বিক্রিত পণ্যের ক্রয়মূল্য','মোট লাভ','খরচ','নিট লাভ/ক্ষতি'],[...ms.map(m=>row(m,stat(m+'-01',m+'-31'))),row('সর্বমোট',a)])}</div><p class="mu">নিট লাভ = বিক্রয় − বিক্রিত পণ্যের ক্রয়মূল্য − খরচ (ডেলিভারড অর্ডার বিক্রয়ে ধরা হয়)</p>`};
V.rep=()=>{const m=months(6);return `<div class="card"><h3>গত ৬ মাস</h3>${chart(m.map(x=>x.slice(2)),[{n:'বিক্রয়',c:'#1558d6',d:m.map(x=>stat(x+'-01',x+'-31').sales)},{n:'ক্রয়',c:'#8b5cf6',d:m.map(x=>stat(x+'-01',x+'-31').buy)},{n:'খরচ',c:'#f59e0b',d:m.map(x=>stat(x+'-01',x+'-31').exp)},{n:'লাভ',c:'#16a34a',d:m.map(x=>stat(x+'-01',x+'-31').profit)}])}</div>
<div class="card"><h3>প্রিন্ট ও Excel রিপোর্ট</h3><div class="g">${inp('rd','দৈনিক — তারিখ','date',td())}${inp('rm','মাসিক — মাস','month',td().slice(0,7))}</div><button class="b" onclick="rp('d')">দৈনিক রিপোর্ট প্রিন্ট</button><button class="b" onclick="rp('m')">মাসিক রিপোর্ট প্রিন্ট</button><br><button class="b s" onclick="xl('d')">দৈনিক Excel</button><button class="b s" onclick="xl('m')">মাসিক Excel</button><p class="mu">Excel ফাইলটি Google Drive-এ আপলোড করে Google Sheets-এ খুলতে পারবেন।</p></div>
<div class="card"><h3>সেটিংস ও Google Sheets সিঙ্ক</h3><div class="g">${sel('sp','মেমোর কাগজ',[['a','A5 / A4'],['80','থার্মাল ৮০ মিমি']],LS('ste_paper'),'onchange="SS(\'ste_paper\',this.value)"')}${inp('su','Apps Script Web App URL','url',LS('ste_url'),'onchange="SS(\'ste_url\',this.value.trim())"')}${inp('sk','গোপন কোড (SECRET)','text',LS('ste_key'),'onchange="SS(\'ste_key\',this.value.trim())"')}</div><button class="b s" onclick="sync(1)">এখনই Sheets-এ পাঠান</button><button class="b o" onclick="pull()">Sheets থেকে ডেটা আনুন</button><p id="sm" class="mu">URL দেওয়া থাকলে প্রতিটি পরিবর্তনের কয়েক সেকেন্ড পরে নিজে থেকেই সিঙ্ক হবে।</p></div>
<div class="card"><h3>ডেটা ব্যাকআপ</h3><button class="b o" onclick="bk()">ব্যাকআপ ডাউনলোড</button><label style="margin-top:8px">ব্যাকআপ ফিরিয়ে আনুন<input type="file" accept=".json" onchange="rs(event)"></label></div>`};
const per=k=>k=='d'?[g('rd'),g('rd'),'দৈনিক রিপোর্ট: '+g('rd')]:[g('rm')+'-01',g('rm')+'-31','মাসিক রিপোর্ট: '+g('rm')];
const rows={sales:s=>s.S.map(x=>[x.date,x.no,x.cname,x.total,x.paid,x.due]),purch:s=>s.U.map(u=>[u.date,u.sup,u.pname,u.qty,u.qty*u.cost,u.paid]),exp:s=>s.X.map(x=>[x.date,x.cat,x.amt,x.note]),ord:s=>s.OA.map(o=>[o.date,o.name,o.phone,o.addr,o.pname,o.qty,o.qty*o.price,o.del,o.paid,cod(o),o.courier,o.status])};
function rp(k){if(!g(k=='d'?'rd':'rm'))return alert('তারিখ দিন');const[a,b,t]=per(k),s=stat(a,b);pr(`<h3>${t}</h3>`+tbl(['বিবরণ','টাকা'],[['মোট বিক্রয়',f(s.sales)],['ক্রয়',f(s.buy)],['বিক্রিত পণ্যের ক্রয়মূল্য',f(s.cogs)],['খরচ',f(s.exp)],['নিট লাভ',f(s.profit)],['নগদ আয়',f(s.cashIn)],['নগদ ব্যয়',f(s.cashOut)]])+'<h4>বিক্রয়</h4>'+tbl(['তারিখ','মেমো','গ্রাহক','মোট','পরিশোধ','বাকি'],rows.sales(s).map(r=>r.map((c,i)=>i>2?f(c):c)))+'<h4>ক্রয়</h4>'+tbl(['তারিখ','সরবরাহকারী','পণ্য','পরিমাণ','মোট','পরিশোধ'],rows.purch(s).map(r=>r.map((c,i)=>i>3?f(c):c)))+'<h4>খরচ</h4>'+tbl(['তারিখ','খাত','পরিমাণ','নোট'],rows.exp(s).map(r=>[r[0],r[1],f(r[2]),esc(r[3])])))}
function dl(t,nm,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:m}));a.download=nm;a.click()}
const shs=s=>({'সারাংশ':[['বিবরণ','টাকা'],['মোট বিক্রয়',s.sales],['ক্রয়',s.buy],['বিক্রিত পণ্যের ক্রয়মূল্য',s.cogs],['খরচ',s.exp],['নিট লাভ',s.profit],['নগদ আয়',s.cashIn],['নগদ ব্যয়',s.cashOut]],'বিক্রয়':[['তারিখ','মেমো','গ্রাহক','মোট','পরিশোধ','বাকি'],...rows.sales(s)],'ক্রয়':[['তারিখ','সরবরাহকারী','পণ্য','পরিমাণ','মোট','পরিশোধ'],...rows.purch(s)],'খরচ':[['তারিখ','খাত','পরিমাণ','নোট'],...rows.exp(s)],'অর্ডার':[['তারিখ','নাম','ফোন','ঠিকানা','পণ্য','পরিমাণ','মোট','ডেলিভারি','অগ্রিম','COD','কুরিয়ার','স্ট্যাটাস'],...rows.ord(s)],'স্টক':[['কোড','নাম','ক্রয়','বিক্রয়','স্টক'],...db.p.map(p=>[p.code,p.name,p.buy,p.sell,p.stock])],'গ্রাহক বাকি':[['নাম','ফোন','বাকি'],...db.c.map(c=>[c.name,c.phone,custDue(c).due])]});
function xl(k){if(!g(k=='d'?'rd':'rm'))return alert('তারিখ দিন');const[a,b]=per(k),sh=shs(stat(a,b));
let x='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">';
for(const nm in sh)x+=`<Worksheet ss:Name="${nm}"><Table>${sh[nm].map(r=>`<Row>${r.map(c=>`<Cell><Data ss:Type="${typeof c=='number'?'Number':'String'}">${esc(c)}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet>`;
dl(x+'</Workbook>','STE-'+(k=='d'?g('rd'):g('rm'))+'.xls','application/vnd.ms-excel')}
function sync(m){const u=LS('ste_url');if(!u){if(m)alert('আগে Web App URL দিন');return}
fetch(u,{method:'POST',mode:'no-cors',body:JSON.stringify({key:LS('ste_key'),sheets:shs(stat()),backup:JSON.stringify(db)})}).then(()=>msg('Sheets-এ পাঠানো হয়েছে: '+new Date().toLocaleTimeString())).catch(()=>msg('সিঙ্ক হয়নি — ইন্টারনেট ও URL দেখুন'))}
function pull(){const u=LS('ste_url');if(!u)return alert('আগে Web App URL দিন');if(!confirm('এই ডিভাইসের ডেটা Sheets-এর ডেটা দিয়ে বদলে যাবে। চালিয়ে যাবেন?'))return;
fetch(u+(u.includes('?')?'&':'?')+'key='+encodeURIComponent(LS('ste_key'))).then(r=>r.json()).then(j=>{if(!j.backup)throw 0;db=JSON.parse(j.backup);save();render();alert('ডেটা আনা হয়েছে')}).catch(()=>alert('ডেটা আনা যায়নি — URL, কোড ও ইন্টারনেট দেখুন'))}
function bk(){dl(JSON.stringify(db),'ste-backup-'+td()+'.json','application/json')}
function rs(e){const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();render()}catch(x){alert('ফাইলটি সঠিক নয়')}};r.readAsText(e.target.files[0])}
render();
</script></body></html>
